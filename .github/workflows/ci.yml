name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install zsh and fish
        # The shell hook tests run every supported shell for real.
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh fish

      - name: Install tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install github.com/incu6us/goimports-reviser/v3@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Check formatting
        run: |
          gofumpt -w .
          goimports-reviser -recursive -rm-unused -format -project-name github.com/atbuy/carrier ./...
          git diff --exit-code

      - name: Lint
        run: make lint

      - name: Test with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Show coverage
        run: go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
